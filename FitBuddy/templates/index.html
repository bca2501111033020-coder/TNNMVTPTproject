{% extends "base.html" %}
{% block title %}FitBuddy - AI Fitness Plan Generator{% endblock %}

{% block content %}
<section class="hero card">
    <h1>FitBuddy &ndash; AI Fitness Plan Generator</h1>
    <p class="subtitle">Generate a personalized 7-day workout plan and nutrition guidance using AI.</p>
</section>

<section class="card form-card">
    <h2>Tell us about yourself</h2>
    <form action="/generate-workout" method="post" class="fitbuddy-form">
        <div class="form-row">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Priya Sharma" required maxlength="100">
        </div>

        <div class="form-row">
            <label for="user_id">User ID</label>
            <input type="text" id="user_id" name="user_id" placeholder="e.g. student001" required maxlength="64" pattern="[A-Za-z0-9_.-]+" title="Letters, numbers, _ - and . only">
        </div>

        <div class="form-row form-row-half">
            <div>
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="10" max="100" required>
            </div>
            <div>
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" name="weight" min="1" max="400" step="0.1" required>
            </div>
        </div>

        <div class="form-row">
            <label for="goal">Fitness Goal</label>
            <select id="goal" name="goal" required>
                {% for g in goals %}
                <option value="{{ g }}">{{ g }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <label for="intensity">Workout Intensity</label>
            <select id="intensity" name="intensity" required>
                {% for i in intensities %}
                <option value="{{ i }}">{{ i }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary" id="generateBtn">Generate Plan</button>
    </form>
</section>
{% endblock %}
